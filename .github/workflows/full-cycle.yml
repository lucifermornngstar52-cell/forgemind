name: Full Cycle (Research + Code + Deploy)

on:
  schedule:
    # Every 2 hours: 1h research, 1h code
    - cron: "0 */2 * * *"
  workflow_dispatch:

# FORGEMIND uses its OWN brain — Ollama with qwen2.5:3b (open-source, local, no API key)
# OpenAI is kept as fallback only if Ollama fails to start

jobs:
  research:
    name: "Phase 1 - Deep Research (1h)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install httpx pyyaml rich openai beautifulsoup4 chromadb

      - name: Install Ollama + pull model (independent brain)
        run: |
          echo "=== Installing Ollama (local LLM, no external API) ==="
          curl -fsSL https://ollama.com/install.sh | sh
          # Start ollama server in background
          ollama serve &
          sleep 5
          echo "=== Pulling qwen2.5:3b (open-source model, ~2GB) ==="
          ollama pull qwen2.5:3b
          echo "=== Ollama ready ==="
          # Quick smoke test
          curl -s http://localhost:11434/v1/models | python3 -c "import json,sys; d=json.load(sys.stdin); print('Models:', [m['id'] for m in d.get('data',[])])"

      - name: Research phase (many cycles)
        env:
          LLM_BACKEND: ollama
          OLLAMA_HOST: http://localhost:11434
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN_2: ${{ secrets.GH_PAT }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "=== DEEP RESEARCH PHASE (using local Ollama brain) ==="
          python main.py --loop 5 --research --deep
          echo "Research complete"

      - name: Commit research findings
        run: |
          git config user.name "Forgemind"
          git config user.email "forge@self.ai"
          git add -A
          if git diff --staged --quiet; then
            echo "No new findings"
          else
            git commit -m "research: knowledge gathering $(date -u +%Y-%m-%dT%H:%M)"
            git fetch origin main
            git rebase origin/main || git rebase --abort || true
            git push origin HEAD:main || git push --force-with-lease origin HEAD:main
          fi

  code:
    name: "Phase 2 - Code Improvement (1h)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: research
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install httpx pyyaml rich openai beautifulsoup4 chromadb

      - name: Install Ollama + pull model (independent brain)
        run: |
          echo "=== Installing Ollama ==="
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          echo "=== Pulling qwen2.5:3b ==="
          ollama pull qwen2.5:3b
          echo "=== Ollama ready ==="
          curl -s http://localhost:11434/v1/models | python3 -c "import json,sys; d=json.load(sys.stdin); print('Models:', [m['id'] for m in d.get('data',[])])"

      - name: Code improvement phase
        env:
          LLM_BACKEND: ollama
          OLLAMA_HOST: http://localhost:11434
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN_2: ${{ secrets.GH_PAT }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "=== CODE IMPROVEMENT PHASE (using local Ollama brain) ==="
          python main.py --loop 5
          echo "Code phase complete"

      - name: Commit code improvements
        run: |
          git config user.name "Forgemind"
          git config user.email "forge@self.ai"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "auto: self-improvement cycle $(date -u +%Y-%m-%dT%H:%M)"
            git fetch origin main
            git rebase origin/main || git rebase --abort || true
            git push origin HEAD:main || git push --force-with-lease origin HEAD:main
          fi

  deploy:
    name: "Phase 3 - Deploy + APK"
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Trigger Render redeploy
        run: |
          sleep 10
          curl -s -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' || true
          echo "Render deploy triggered"

      - name: Trigger APK build
        run: |
          curl -s -X POST "https://api.github.com/repos/lucifermornngstar52-cell/forgemind-mobile/actions/workflows/build.yml/dispatches" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"main"}' || true
          echo "APK build triggered"
