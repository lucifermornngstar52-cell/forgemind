name: Forgemind Auto-Cycle

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  self-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run self-diagnostic
        env:
          GITHUB_TOKEN_2: ${{ secrets.GH_PAT }}
        run: python -c "from core.diagnostic import SelfDiagnostic; d = SelfDiagnostic('.'); r = d.run_full_check(); print('PASS' if r['syntax_ok'] and r['git_ok'] else 'FAIL')"

      - name: Run self-improvement cycle
        env:
          LLM_BACKEND: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN_2: ${{ secrets.GH_PAT }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: python main.py --loop 3 --research

      - name: Commit and push changes
        run: |
          git config user.name "Forgemind Bot"
          git config user.email "forgemind@bot.local"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: self-improvement cycle $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
